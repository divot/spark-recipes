recipe_version: "1"

name: Qwen3.8-Flash-Next-NVFP4-DGPP

description: >-
  Single-DGX-Spark Qwen3.8-Flash-Next NVFP4 served by DGPP with its current
  GB10 configuration: FP8 dense weights and vocabulary head, lossless BF12
  companion weights, mapped n-gram table, chunked prefill, decode graphs, and
  one-token MTP drafting.

model: nvidia/Qwen3.8-Flash-Next-NVFP4

solo_only: true

build: dgpp-qwen38-41e3216

defaults:
  host: 0.0.0.0
  port: 8000

env:
  HF_HUB_OFFLINE: "1"
  DGPP_RESIDENT_CACHE_DIR: /root/.cache/huggingface/dgpp-resident

command: |
  dgpp-serve \
    --model nvidia/Qwen3.8-Flash-Next-NVFP4 \
    --bind-host {host} \
    --port {port} \
    --kv-capacity 262144 \
    --kv-dtype bf16 \
    --bf16-weights bf12+bf16 \
    --ngram-table mmap \
    --dense-weights fp8 \
    --fp8-head mma \
    --max-concurrency 4 \
    --default-max-tokens 32768 \
    --queue-limit 8 \
    --max-connections 64 \
    --decode-graph \
    --mtp \
    --mtp-depth 1 \
    --sampling-candidates 128 \
    --prefix-cache-gib 3 \
    --admission full \
    --admission-window 256 \
    --prefill-budget-tokens 4096 \
    --prefill-idle-budget-tokens 4096 \
    --stats-interval-s 10
