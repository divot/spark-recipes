# Recipe: Ornith-1.5-35B-A3B-NVFP4 (solo)
# Conservative single-DGX-Spark profile with a 128K context window.

recipe_version: "1"
name: Ornith-1.5-35B-A3B-NVFP4 (Solo)
description: vLLM serving ornith-ai/Ornith-1.5-35B-A3B-NVFP4 on one DGX Spark

model: ornith-ai/Ornith-1.5-35B-A3B-NVFP4
container: vllm-node

solo_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.75
  max_model_len: 131072
  max_num_seqs: 8
  max_num_batched_tokens: 4096

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve ornith-ai/Ornith-1.5-35B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --linear-backend auto \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enforce-eager \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice
