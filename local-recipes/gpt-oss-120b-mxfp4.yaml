# Local recipe: OpenAI GPT-OSS 120B MXFP4
# Mirrors the optimized upstream GPT-OSS recipe for a single DGX Spark while
# keeping local provenance and a distinct deterministic container name.

recipe_version: "1"
name: OpenAI GPT-OSS 120B MXFP4 (Local)
description: Single-DGX Spark GPT-OSS 120B using the optimized CUTLASS MXFP4 and FlashInfer path

model: openai/gpt-oss-120b
container: vllm-node-mxfp4
solo_only: true

build_args:
  - --exp-mxfp4

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_num_batched_tokens: 8192

env:
  VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"

command: |
  vllm serve openai/gpt-oss-120b \
      --tool-call-parser openai \
      --reasoning-parser openai_gptoss \
      --enable-auto-tool-choice \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --load-format fastsafetensors \
      --quantization mxfp4 \
      --mxfp4-backend CUTLASS \
      --mxfp4-layers moe,qkv,o,lm_head \
      --attention-backend FLASHINFER \
      --kv-cache-dtype fp8 \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --host {host} \
      --port {port}
